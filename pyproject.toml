[project]
name = "finalproject-mikhailov-m26-555"
version = "0.1.0"
description = "Управление виртуальным валютным портфелем и получение курсов из внешних API."
readme = "README.md"
authors = [
    { name = "Tinny", email = "yozhicksun@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.32.5",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"
valutatrade-parser = "valutatrade_hub.parser_service.scheduler:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""
source-include = ["main.py", "Makefile", "uv.lock", ".python-version"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.valutatrade]
DATA_DIR = "data"
USERS_FILE = "users.json"
PORTFOLIOS_FILE = "portfolios.json"
RATES_FILE = "rates.json"
HISTORY_FILE = "exchange_rates.json"
RATES_TTL_SECONDS = 300
DEFAULT_BASE_CURRENCY = "USD"
LOG_DIR = "logs"
LOG_FILE = "actions.log"
PARSER_LOG_FILE = "parser.log"
LOG_LEVEL = "INFO"
LOG_FORMAT = "%(levelname)s %(asctime)s %(message)s"
LOG_DATE_FORMAT = "%Y-%m-%dT%H:%M:%S"
LOG_MAX_BYTES = 1048576
LOG_BACKUP_COUNT = 3
LOG_VERBOSE = false
